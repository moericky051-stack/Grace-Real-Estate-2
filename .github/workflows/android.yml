name: Android CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Corrupt ဖြစ်နေသော gradle-wrapper.jar ကို ကျော်ရန် gradle command ကို တိုက်ရိုက်သုံးပြီး Build လုပ်ခြင်း
      - name: Build Debug APK (Skip Tests)
        run: gradle assembleDebug -x test

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: grace-realestate-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
